name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # also started by rl-mmr.yml after new Rocket League data is merged
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Rocket League data
        run: |
          mkdir -p public/data
          if git fetch --depth=1 origin rl-data && git show FETCH_HEAD:rocket-league.json > public/data/rocket-league.json; then
            echo "Added rocket-league.json from rl-data."
          else
            rm -f public/data/rocket-league.json
            echo "No Rocket League data found; building without it."
          fi

      - name: Build project
        run: npm run build

      - name: Upload production-ready files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
